# Render Blueprint — https://render.com/docs/blueprint-spec
#
# 1. Create a PostgreSQL instance on Render and link it to this web service (injects DATABASE_URL).
# 2. In the dashboard, set secret env vars (never commit them): DJANGO_SECRET_KEY, JWT_SIGNING_KEY,
#    DJANGO_SUPERUSER_PASSWORD, ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS, CORS_ALLOWED_ORIGINS.
# 3. Optional superuser on each pre-deploy: ENSURE_SUPERUSER=1 plus DJANGO_SUPERUSER_USERNAME / EMAIL / PASSWORD.
#    See backend/.env.example section "Render (producción)".
# 4. Until a tenant Domain exists for your *.onrender.com host, set SHOW_PUBLIC_IF_NO_TENANT_FOUND=true
#    so health checks and first requests hit the schema público; turn off after onboarding a domain.
#
# Static site (Render dashboard), choose ONE:
# A) Root Directory `frontend` → Publish `dist`, Build `bash build.sh` (frontend/build.sh)
# B) Root Directory empty (repo root) → Publish `frontend/dist`, Build `npm run build` (uses root package.json → frontend/)
# Set VITE_API_BASE to your API URL on the static site.

version: "1"
services:
  - type: web
    name: system-nestwork
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    # Build script (rootDir = backend: solo existe backend/ en el contexto de build).
    buildCommand: bash build.sh
    # Use python -m gunicorn so the binary is found (Render PATH often omits the venv scripts dir).
    startCommand: python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    preDeployCommand: python manage.py migrate --noinput && python manage.py ensure_superuser
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: ENSURE_SUPERUSER
        value: "1"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: JWT_SIGNING_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Same origin as your Render static site (no trailing slash). Merged into CORS + CSRF in production.py.
      - key: FRONTEND_BASE_URL
        sync: false
      # First deploy on Render: set to true until a Domain exists for your API host; then false.
      - key: SHOW_PUBLIC_IF_NO_TENANT_FOUND
        sync: false
