[pytest]
# Tests usan development. Para pytest en un entorno tipo Render, exporta antes:
#   export DJANGO_SETTINGS_MODULE=config.settings.production
# (o deja development si solo quieres validar imports sin producción completa.)
DJANGO_SETTINGS_MODULE = config.settings.development
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers -v --tb=short
markers =
    django_db: mark test as using the database
